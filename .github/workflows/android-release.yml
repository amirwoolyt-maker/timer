name: Test and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Check release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.version || github.ref_name }}
          IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = "true" ] && [ "$REQUESTED_TAG" != "v$version" ]; then
            echo "::error::Release tag $REQUESTED_TAG must match app version v$version."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Test Flutter
        run: flutter test --reporter expanded

      - name: Test preview server
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build self-contained web app
        run: flutter build web --release --no-pub --no-web-resources-cdn

      - name: Package web app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cd build/web
          zip -r "../../dist/rahyar-web-${APP_VERSION}.zip" .

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/rahyar-web-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  build-and-release:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keystore = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          if not keystore:
              raise SystemExit("Missing repository secret: ANDROID_KEYSTORE_BASE64")

          Path("android/app/rahyar-upload-key.jks").write_bytes(
              base64.b64decode(keystore, validate=True)
          )
          properties = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "app/rahyar-upload-key.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            echo "## Android build failure" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            awk '/\* What went wrong:/{show=1} show{print} /\* Try:/{exit}' build.log >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(awk '/\* What went wrong:/{show=1} show{print} /\* Try:/{exit}' build.log || true)
            exit 1
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: build.log

      - name: Download tested web build
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: dist

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Align release tag with tested source
        env:
          RELEASE_TAG: v${{ needs.checks.outputs.version }}
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: v${{ needs.checks.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            dist/rahyar-web-${{ needs.checks.outputs.version }}.zip
