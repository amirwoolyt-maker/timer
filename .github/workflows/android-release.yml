name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keystore = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          if not keystore:
              raise SystemExit("Missing repository secret: ANDROID_KEYSTORE_BASE64")

          Path("android/app/rahyar-upload-key.jks").write_bytes(
              base64.b64decode(keystore, validate=True)
          )
          properties = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "app/rahyar-upload-key.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            echo "## Android build failure" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            grep -E "(FAILURE:|What went wrong:|Could not|Execution failed|error:|\.dart:[0-9]+|Gradle task)" build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E "(FAILURE:|What went wrong:|Could not|Execution failed|error:|\.dart:[0-9]+|Gradle task)" build.log | tail -n 25 || true)
            exit 1
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: build.log

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
